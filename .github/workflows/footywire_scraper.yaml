name: fetch footywire data weekly

# Scheduled and manual only. This job is expensive - a few hundred page
# fetches - and there is no reason for an ordinary commit to main to kick it
# off. Use `gh workflow run` (or the Actions tab) to trigger it by hand.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 20 * * 2"

permissions:
  contents: write

jobs:
  scrape-and-commit:
    # footywire.com geo-fences to Australia: every GitHub-hosted runner gets a
    # 503, confirmed across ubuntu/macos/windows and from datacenters in seven
    # countries, while a Sydney host gets 200. So this job runs on a
    # self-hosted runner in Australia. Never add a pull_request trigger to
    # this workflow - the repo is public, and that would let fork code run on
    # that machine.
    runs-on: [self-hosted, sydney]
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      # No setup-r step: R is installed on the runner. The workspace persists
      # between runs, so only install CRAN packages that are actually absent
      # rather than rebuilding the tidyverse every Tuesday.
      - name: Install Dependencies
        run: Rscript -e 'pkgs <- c("pak", "tidyverse", "here", "arrow", "cli"); missing <- setdiff(pkgs, rownames(installed.packages())); if (length(missing)) install.packages(missing) else cat("CRAN dependencies already present\n")'
      - name: Install fitzRoy
        run: Rscript -e 'pak::pak("jimmyday12/fitzRoy")'
      - name: Get data
        run: Rscript -e 'source(here::here("scripts", "footywire_weekly_script.R"), echo = TRUE)'
      - name: Configure Git
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
      - name: Pull latest changes
        run: |
          git pull origin main
      - name: Commit
        run: |
          git add data-raw/player_stats/
          git commit -m 'updating weekly_data_process' || echo "No changes to commit"
          git push || echo "No changes to commit"
      - name: Upload Parquet to release
        run: |
          gh release create data --title "Data assets" --notes "Rolling release — Parquet files updated weekly by CI." 2>/dev/null || true
          gh release upload data data/footywire_player_stats.parquet --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
