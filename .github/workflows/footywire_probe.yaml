# Is footywire.com reachable from a given runner?
#
# footywire.com has answered every GitHub-hosted runner with HTTP 503 since
# 2026-07-07 - confirmed on ubuntu, macos and windows, under every
# User-Agent, while the same request serves 200 from an ordinary connection.
# That is why the weekly scrape fails; it is an IP block, not a fixture or
# User-Agent problem.
#
# Kept around to check any candidate host before moving the weekly job to it:
# dispatch with `runner` set to `self-hosted` (or a label of your own) and
# look for http=200.
name: footywire connectivity probe

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner to probe from (e.g. ubuntu-latest, self-hosted)"
        required: false
        default: "ubuntu-latest"

jobs:
  probe:
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    steps:
      - name: Outbound IP
        shell: bash
        run: curl -s --max-time 20 https://api.ipify.org || echo "(ipify unreachable)"

      - name: curl footywire with a range of User-Agents
        shell: bash
        run: |
          url="https://www.footywire.com/afl/footy/ft_match_list?year=2010"
          probe() {
            printf '%-55s ' "$1"
            curl -s -o /dev/null --max-time 30 \
              -w 'http=%{http_code} exitcode=%{exitcode} time=%{time_total}s\n' \
              -A "$1" "$url" || echo "curl failed"
          }
          probe "fitzRoy R package (https://github.com/jimmyday12/fitzRoy)"
          probe "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          echo "--- default curl UA (expected 406 anywhere - footywire rejects it by UA):"
          curl -s -o /dev/null --max-time 30 -w 'http=%{http_code} exitcode=%{exitcode}\n' "$url" || true
          echo "--- afltables control (expected 200):"
          curl -s -o /dev/null --max-time 30 -w 'http=%{http_code} exitcode=%{exitcode}\n' \
            -A "fitzRoy R package" "https://afltables.com/afl/seas/2025.html" || true
